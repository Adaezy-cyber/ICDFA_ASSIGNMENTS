# REFERENCE DESIGN ONLY - taken from the assignment brief (Step 7).
# Not captured from a running system. Not deployed. Not tested.
# Intended path on Ubuntu: /etc/nginx/sites-available/grc-lab
server {
    listen 80;
    server_name _;
    root /var/www/grc-lab;
    access_log /var/log/nginx/grc_access.log combined;
    error_log /var/log/nginx/grc_error.log;
    location / { autoindex off; }
    location /archive/ { deny all; }
}
